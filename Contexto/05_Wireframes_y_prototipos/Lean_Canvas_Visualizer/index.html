<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean Canvas · Nativa Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16151A;
    --violet:#6D4AFF;
    --violet-deep:#4B2ED4;
    --violet-soft:#F1EDFF;
    --paper:#FFFFFF;
    --bg:#F6F5FA;
    --muted:#8A8797;
    --line:#E7E3F2;
    --display:"Outfit","Segoe UI",system-ui,sans-serif;
    --body:"Inter","Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono","Consolas",monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:28px 32px 40px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- encabezado ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--violet);
    margin-bottom:6px;
  }
  h1{
    font-family:var(--display);
    font-size:34px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.05;
  }
  h1 .sub{color:var(--muted);font-weight:500}

  .estado-global{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .contador{
    font-family:var(--display);
    font-size:30px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1;
  }
  .contador em{
    font-style:normal;
    color:var(--muted);
    font-size:17px;
    font-weight:500;
  }
  .barra{
    width:150px;
    height:5px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .barra i{
    display:block;
    height:100%;
    width:0;
    border-radius:99px;
    background:linear-gradient(90deg,var(--violet),var(--violet-deep));
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .latido{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:var(--mono);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .latido b{
    width:7px;height:7px;border-radius:99px;
    background:var(--violet);
    animation:latir 2s ease-in-out infinite;
  }
  .latido.caido b{background:#D8443C;animation:none}
  @keyframes latir{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.75)}}

  /* ---------- grilla del canvas ---------- */
  .canvas{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:minmax(150px,1fr) minmax(150px,1fr) minmax(120px,auto);
    gap:10px;
  }

  .b{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 15px 13px;
    display:flex;
    flex-direction:column;
    min-height:0;
    position:relative;
    transition:border-color .3s, box-shadow .3s, background .3s;
  }
  .b:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

  .b-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-shrink:0;
  }
  .n{
    font-family:var(--mono);
    font-size:10px;
    font-weight:600;
    width:19px;height:19px;
    border-radius:6px;
    display:grid;place-items:center;
    background:var(--violet-soft);
    color:var(--violet);
    flex-shrink:0;
    transition:background .3s,color .3s;
  }
  .b-tit{
    font-family:var(--display);
    font-size:13.5px;
    font-weight:600;
    letter-spacing:-.01em;
    line-height:1.2;
  }

  .b-cuerpo{
    flex:1;
    min-height:0;
    overflow-y:auto;
    font-size:13.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .b-cuerpo::-webkit-scrollbar{width:5px}
  .b-cuerpo::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

  /* estado: vacío */
  .b.vacio{
    background:transparent;
    border-style:dashed;
    border-color:#DBD6EB;
  }
  .b.vacio .n{background:#EEEBF6;color:#B3AECB}
  .b.vacio .b-tit{color:#A9A4BC}
  .b.vacio .b-cuerpo::before{
    content:"Sin completar";
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    color:#BBB6CE;
  }

  /* estado: en progreso */
  .b.en_progreso{
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(109,74,255,.11);
  }
  .b.en_progreso .n{background:var(--violet);color:#fff}
  .b.en_progreso::after{
    content:"";
    position:absolute;top:13px;right:13px;
    width:6px;height:6px;border-radius:99px;
    background:var(--violet);
    animation:latir 1.4s ease-in-out infinite;
  }

  /* estado: listo */
  .b.listo .n{background:var(--violet-deep);color:#fff}

  /* llegada de contenido nuevo */
  @keyframes aterrizar{
    0%{opacity:0;transform:translateY(7px)}
    100%{opacity:1;transform:translateY(0)}
  }
  .b.nuevo .b-cuerpo{animation:aterrizar .45s cubic-bezier(.2,.7,.3,1)}
  .b.nuevo{animation:destello 1.1s ease-out}
  @keyframes destello{
    0%{box-shadow:0 0 0 0 rgba(109,74,255,.42)}
    100%{box-shadow:0 0 0 16px rgba(109,74,255,0)}
  }

  /* posiciones del lean canvas clásico */
  #problema         {grid-column:1/3;  grid-row:1/3}
  #solucion         {grid-column:3/5;  grid-row:1/2}
  #metricas         {grid-column:3/5;  grid-row:2/3}
  #propuesta_valor  {grid-column:5/7;  grid-row:1/3}
  #ventaja_injusta  {grid-column:7/9;  grid-row:1/2}
  #canales          {grid-column:7/9;  grid-row:2/3}
  #segmento         {grid-column:9/11; grid-row:1/3}
  #estructura_costos{grid-column:1/6;  grid-row:3/4}
  #valor_capturado  {grid-column:6/11; grid-row:3/4}

  #propuesta_valor{background:var(--violet-soft);border-color:#DCD3FF}
  #propuesta_valor.vacio{background:transparent}
  #propuesta_valor .b-cuerpo{font-size:14.5px;font-weight:500}

  /* ---------- aviso de error ---------- */
  .aviso{
    display:none;
    background:#fff;
    border:1px solid #F0C9C6;
    border-left:3px solid #D8443C;
    border-radius:12px;
    padding:15px 18px;
    margin-bottom:18px;
  }
  .aviso.ver{display:block}
  .aviso h2{
    font-family:var(--display);
    font-size:15px;
    font-weight:600;
    margin-bottom:5px;
  }
  .aviso p{font-size:13.5px;color:#57545F;line-height:1.6}
  .aviso code{
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--bg);
    padding:2px 6px;
    border-radius:5px;
  }

  footer{
    margin-top:20px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.07em;
    color:#B3AEC4;
    text-transform:uppercase;
  }

  @media (max-width:1000px){
    body{padding:20px 16px 32px}
    h1{font-size:26px}
    .canvas{
      grid-template-columns:1fr;
      grid-template-rows:none;
    }
    .b{min-height:118px}
    #problema,#solucion,#metricas,#propuesta_valor,
    #ventaja_injusta,#canales,#segmento,
    #estructura_costos,#valor_capturado{grid-column:1/2;grid-row:auto}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Nativa Digital · FCE Austral</div>
    <h1 id="titulo">Lean Canvas <span class="sub" id="equipo"></span></h1>
  </div>
  <div class="estado-global">
    <div>
      <div class="contador"><span id="hechos">0</span><em> / 9</em></div>
      <div class="barra"><i id="progreso"></i></div>
    </div>
    <div class="latido" id="latido"><b></b><span id="latido-txt">En vivo</span></div>
  </div>
</header>

<div class="aviso" id="aviso">
  <h2>No se puede leer canvas-data.js</h2>
  <p id="aviso-txt"></p>
</div>

<main class="canvas" id="canvas"></main>

<footer>Se actualiza solo · abrí este archivo con doble clic, no hace falta servidor</footer>

<script>
const BLOQUES = [
  {id:"problema",          n:1, titulo:"Problema"},
  {id:"segmento",          n:2, titulo:"Segmento de clientes"},
  {id:"propuesta_valor",   n:3, titulo:"Propuesta de valor única"},
  {id:"solucion",          n:4, titulo:"Solución"},
  {id:"canales",           n:5, titulo:"Canales"},
  {id:"metricas",          n:6, titulo:"Métricas clave"},
  {id:"valor_capturado",   n:7, titulo:"Valor capturado"},
  {id:"estructura_costos", n:8, titulo:"Estructura de costos"},
  {id:"ventaja_injusta",   n:9, titulo:"Ventaja injusta"}
];

const canvas = document.getElementById("canvas");
const previo = {};

// Orden de la grilla clásica (distinto del orden de completado).
const ORDEN_GRILLA = ["problema","solucion","metricas","propuesta_valor",
                      "ventaja_injusta","canales","segmento",
                      "estructura_costos","valor_capturado"];

ORDEN_GRILLA.forEach(id => {
  const b = BLOQUES.find(x => x.id === id);
  const el = document.createElement("section");
  el.className = "b vacio";
  el.id = b.id;
  el.tabIndex = 0;
  el.innerHTML = `
    <div class="b-top">
      <div class="n">${b.n}</div>
      <div class="b-tit">${b.titulo}</div>
    </div>
    <div class="b-cuerpo"></div>`;
  canvas.appendChild(el);
  previo[b.id] = "";
});

function pintar(datos){
  document.getElementById("equipo").textContent =
    [datos.proyecto, datos.equipo].filter(Boolean).join(" · ");

  let listos = 0;

  BLOQUES.forEach(b => {
    const dato = (datos.bloques && datos.bloques[b.id]) || {};
    const texto = (dato.contenido || "").trim();
    const estado = dato.estado || "vacio";
    const el = document.getElementById(b.id);
    const cuerpo = el.querySelector(".b-cuerpo");

    if (estado === "listo") listos++;

    if (texto !== previo[b.id]) {
      cuerpo.textContent = texto;
      previo[b.id] = texto;
      if (texto) {
        el.classList.remove("nuevo");
        void el.offsetWidth;          // reinicia la animación
        el.classList.add("nuevo");
      }
    }

    el.className = "b " + (texto ? estado : "vacio") +
                   (el.classList.contains("nuevo") ? " nuevo" : "");
  });

  document.getElementById("hechos").textContent = listos;
  document.getElementById("progreso").style.width = (listos / 9 * 100) + "%";
}

function conectado(ok, motivo){
  const l = document.getElementById("latido");
  const aviso = document.getElementById("aviso");
  l.classList.toggle("caido", !ok);
  document.getElementById("latido-txt").textContent = ok ? "En vivo" : "Sin conexión";
  aviso.classList.toggle("ver", !ok);
  if (!ok) document.getElementById("aviso-txt").innerHTML = motivo;
}

// canvas-data.js se lee inyectando un <script>, no con fetch: fetch() a un
// archivo local está bloqueado por el navegador cuando esta página se abre
// con doble clic (file://). Un <script src="..."> sí se puede cargar así,
// que es justamente lo que permite que todo esto funcione sin servidor.
let intentosFallidos = 0;

function leer(){
  const previoScript = document.getElementById("puente-datos");
  if (previoScript) previoScript.remove();
  window.CANVAS_DATA = undefined;

  const s = document.createElement("script");
  s.id = "puente-datos";
  s.src = "canvas-data.js?t=" + Date.now();

  s.onload = () => {
    if (window.CANVAS_DATA) {
      pintar(window.CANVAS_DATA);
      conectado(true);
      intentosFallidos = 0;
    } else {
      fallo();
    }
  };
  s.onerror = fallo;

  document.body.appendChild(s);
}

function fallo(){
  intentosFallidos++;
  // Un par de intentos fallidos al abrir la página son normales (el agente
  // puede estar escribiendo el archivo en ese instante). Recién avisamos
  // si la falla persiste.
  if (intentosFallidos >= 3) {
    conectado(false, `No se pudo leer <code>canvas-data.js</code>. Revisá que el
      archivo esté en la misma carpeta que <code>index.html</code> y que no
      esté vacío. Si el problema sigue, probá abrir este archivo con otro
      navegador (Chrome o Firefox).`);
  }
}

leer();
setInterval(leer, 2000);
</script>
</body>
</html>
